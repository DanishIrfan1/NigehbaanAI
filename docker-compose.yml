services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nigehbaan-backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/backend
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      USE_ADK: ${USE_ADK:-false}
    volumes:
      - .:/app
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    container_name: nigehbaan-mobile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
    volumes:
      - ./mobile-app:/app
      - mobile_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  mobile_node_modules:
